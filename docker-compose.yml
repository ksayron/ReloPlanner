services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reloplanner
      POSTGRES_PASSWORD: reloplanner_dev
      POSTGRES_DB: reloplanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://reloplanner:reloplanner_dev@postgres:5432/reloplanner
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3000
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:3000}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-http://localhost/api/auth/github/callback}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-http://localhost/api/auth/google/callback}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-your_app_id}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-your_app_key}
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./apps/client/dist:/usr/share/nginx/html/client
      - ./apps/internal/dist:/usr/share/nginx/html/internal
    depends_on:
      - api

volumes:
  pgdata:
